name: Solver validation

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_gpu:
        description: Run numerical smoke checks on an existing self-hosted GPU runner
        type: boolean
        default: false

jobs:
  source-and-shaders:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Includes Dawn's null backend: validates WGSL and API calls, does not
      # execute physics or measure graphics performance.
      - run: npm test
      - run: npm run build

  numerical-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.run_gpu
    runs-on: [self-hosted, gpu]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:gpu
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-smoke-report
          path: validation-report.json
